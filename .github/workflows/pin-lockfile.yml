name: Pin Production Dependencies
on:
  push:
    branches: [main]
    paths:
      - package.json
      - scripts/prepare-lockfile.sh
      - scripts/pin-dependencies.cjs
      - .github/workflows/pin-lockfile.yml
permissions:
  contents: write
jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/prepare-lockfile.sh
      - name: Commit exact versions and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "chore: pin production dependencies"
            git push
          fi
